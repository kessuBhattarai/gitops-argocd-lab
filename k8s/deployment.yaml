apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-node-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-node-app

  template:
    metadata:
      labels:
        app: gitops-node-app

    spec:
      containers:
        - name: gitops-node-app
          image: 825252491923.dkr.ecr.us-east-1.amazonaws.com/gitops-node-app:v1

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
